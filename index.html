<!DOCTYPE html>
<html lang="pt-br">
<head>

    body {

      color: #d4af37;

      padding: 40px 20px;
    }
    .card {
      background-color: rgba(212, 175, 55, 0.05);
      border: 1px solid #d4af37;
      border-radius: 12px;

      margin-bottom: 20px;
      letter-spacing: 1px;

    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;

      background-color: #d4af37;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      width: 80%;
      max-width: 300px;
      transition: background 0.3s;
    }
    a.button:hover {
      background-color: #bfa335;
    }

</head>

  </div>
</body>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rádio IAMusic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    .radio-box {
      background: #222;
      border-radius: 15px;
      padding: 20px;
      width: 400px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
      margin: 15px 0;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 20px;
    }
    .btn {
      background: #ff6600;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin: 5px;
    }
    .btn:hover {
      background: #cc5200;
    }
  </style>
</head>
<body>
  <div class="radio-box">
    <h1>🎶 Rádio IAMusic 🎶</h1>

    <!-- PLAYER DE ÁUDIO (precisa do link de streaming real) -->
    <audio id="player" controls autoplay>
      <source src="https://iamusic.radio12345.com/stream.mp3" type="audio/mpeg">
      </audio>
    <br>
    <button class="btn" onclick="document.getElementById('player').play()">▶ Play</button>
    <button class="btn" onclick="document.getElementById('player').pause()">⏸ Pause</button>

</body>
</html>
